<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="A Ghost Festival match-3 roguelike. Bao descends through the underworld to bring Grandma's soul home before dawn.">
<meta name="theme-color" content="#14111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="守灯人">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>The Lantern Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column, Ghost Festival night. Lantern path strip, arena, lacquer board, booster tray. Deliberately single dark theme. */
:root{
  --bg:#14111b; --panel:#211c2a; --panel2:#2b2436; --line:#3c3249; --ink:#f1e8da; --ink-soft:#a99cb4;
  --red:#e8463c; --red-dk:#8f2626; --gold:#f0b84a; --gold-dk:#a8771c; --ghost:#5fe0b0; --lantern:#ff9a3c; --violet:#b58cff;
  --scrim:rgba(8,6,12,.72);
  --brush:"Ma Shan Zheng","ZCOOL XiaoWei","KaiTi","STKaiti",serif;
  --display:"ZCOOL XiaoWei","Ma Shan Zheng",Georgia,"Songti SC",serif;
  --body:"M PLUS Rounded 1c",ui-rounded,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 35% at 12% 8%, rgba(95,224,176,.09), transparent 70%),
    radial-gradient(ellipse 50% 40% at 92% 30%, rgba(181,140,255,.10), transparent 70%),
    radial-gradient(ellipse 90% 45% at 50% 105%, rgba(232,70,60,.13), transparent 70%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--body); font-weight:500;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 28px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{max-width:470px; margin:0 auto; display:flex; flex-direction:column; gap:10px}

.top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0}
h1{font-family:var(--brush); font-weight:400; font-size:2rem; margin:0; color:var(--gold); text-shadow:0 0 14px rgba(255,154,60,.45); line-height:1; white-space:nowrap}
.brand-en{font-family:var(--display); color:var(--ink-soft); font-size:.95rem; white-space:nowrap}
.top-right{display:flex; align-items:center; gap:6px}
.purse{display:flex; align-items:center; gap:5px; background:var(--panel); border:1.5px solid var(--line); border-radius:999px; padding:3px 10px 3px 6px; font-weight:800; font-variant-numeric:tabular-nums}
.coin{display:inline-block; position:relative; width:17px; height:17px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#ffe08a,#e0a42a 70%); border:2px solid var(--gold-dk); flex:none}
.coin::after{content:""; position:absolute; left:50%; top:50%; width:5px; height:5px; transform:translate(-50%,-50%); background:var(--panel); border:1.5px solid var(--gold-dk); border-radius:1px}
.icon-btn{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; display:grid; place-items:center; padding:0}
.icon-btn[aria-pressed="true"]{color:var(--ink-soft); text-decoration:line-through}

.road{display:flex; flex-direction:column; gap:6px}
.act{display:flex; justify-content:space-between; align-items:baseline; font-size:.72rem; color:var(--ink-soft); font-weight:700; letter-spacing:.04em}
.act b{font-family:var(--display); font-weight:400; font-size:.95rem; color:var(--ink); letter-spacing:0}
.path{display:grid; grid-template-columns:repeat(12,1fr); gap:5px; padding-top:3px}
.lamp{position:relative; aspect-ratio:3/4; border-radius:44% 44% 38% 38% / 36% 36% 30% 30%; background:#251f2e; border:1.5px solid #3d3349;
  display:grid; place-items:center; font-family:var(--brush); font-size:.85rem; color:#5f526b}
.lamp::before,.lamp::after{content:""; position:absolute; left:28%; right:28%; height:3px; background:#463b53; border-radius:2px}
.lamp::before{top:-4px} .lamp::after{bottom:-4px}
.lamp.lit{background:radial-gradient(circle at 50% 42%,#ffe0a0,#ff9a3c 58%,#b63d26); border-color:#ffb860; color:#5a1d10; box-shadow:0 0 12px rgba(255,140,60,.5)}
.lamp.lit::before,.lamp.lit::after{background:var(--gold)}
.lamp.now{border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 2px rgba(240,184,74,.35), 0 0 14px rgba(240,184,74,.35); animation:flicker 1.8s ease-in-out infinite}
.lamp.fixed{color:var(--red)}
@keyframes flicker{50%{box-shadow:0 0 0 2px rgba(240,184,74,.2), 0 0 6px rgba(240,184,74,.2)}}

.arena{display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:start; background:var(--panel); border:1.5px solid var(--line); border-radius:20px; padding:10px 10px 12px}
.vs{font-family:var(--brush); color:var(--red); align-self:center; font-size:1.3rem; padding-top:6px}
.side{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
.side canvas{width:84px; height:84px; border-radius:50%}
#pCan{background:radial-gradient(circle, rgba(255,160,80,.28), transparent 68%)}
#eCan{background:radial-gradient(circle, rgba(95,224,176,.2), transparent 68%)}
.name{font-family:var(--display); font-size:1.02rem; text-align:center; line-height:1.15}
.name small{display:block; font-family:var(--body); font-size:.66rem; color:var(--ink-soft); font-weight:700}
.bar{position:relative; width:100%; height:16px; background:#3a2030; border-radius:999px; overflow:hidden; box-shadow:0 0 0 1.5px var(--line)}
.bar .fill{height:100%; width:100%; background:linear-gradient(180deg,#ff7a6a,#c8352f); transition:width .35s ease}
.enemy .bar .fill{background:linear-gradient(180deg,#7ff0c4,#2fa57c)}
.bar span{position:absolute; inset:0; display:grid; place-items:center; font-size:.68rem; font-weight:800; font-variant-numeric:tabular-nums; text-shadow:0 1px 2px rgba(0,0,0,.6)}
.xp{width:100%; height:5px; background:#2f2838; border-radius:999px; overflow:hidden}
.xp i{display:block; height:100%; background:var(--gold); transition:width .35s}
.chips{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; min-height:22px}
.chip{font-size:.66rem; font-weight:800; border-radius:999px; padding:3px 8px; font-variant-numeric:tabular-nums; white-space:nowrap; background:var(--panel2)}
.chip.shield{color:#7fe3b5} .chip.off{opacity:.35}
.chip.guard{color:#c9bfe0} .chip.note{color:var(--gold)}
.intent{display:flex; align-items:center; gap:6px; border-radius:999px; padding:3px 3px 3px 10px; font-size:.68rem; font-weight:800; white-space:nowrap; background:var(--panel2); border:1.5px solid var(--line)}
.intent[data-kind="atk"],.intent[data-kind="charge"]{border-color:#7a2f30; color:#ff8f86}
.intent[data-kind="fire"]{border-color:#2c6d58; color:var(--ghost)}
.intent[data-kind="feast"]{border-color:#7a5422; color:#ffb347}
.intent[data-kind="curse"],.intent[data-kind="lock"],.intent[data-kind="stone"],.intent[data-kind="forget"]{border-color:#4d3a73; color:#c9a8ff}
.intent[data-kind="guard"],.intent[data-kind="heal"],.intent[data-kind="steal"]{color:#d8cfe6}
.iturns{width:20px; height:20px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-variant-numeric:tabular-nums; color:var(--ink)}
.intent.soon{animation:throb .55s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.07)}}
.ihint{font-size:.64rem; color:var(--ink-soft); text-align:center; line-height:1.3; font-weight:700; text-wrap:balance}
.brk{width:100%; height:6px; background:#2f2838; border-radius:999px; overflow:hidden}
.brk i{display:block; height:100%; width:0; background:linear-gradient(90deg,#ffd27a,#ff7a3c); transition:width .25s}

.goal-title{font-family:var(--display); font-size:1.02rem; text-align:center; line-height:1.15}
.goal-title small{display:block; font-family:var(--body); font-size:.66rem; color:var(--ink-soft); font-weight:700}
.goals{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.goal{display:flex; flex-direction:column; align-items:center; gap:1px; font-weight:800; font-size:.8rem; font-variant-numeric:tabular-nums}
.goal canvas{width:38px; height:38px}
.goal.done{color:var(--ghost)}
.moves{display:flex; align-items:baseline; gap:4px; font-size:.7rem; font-weight:800; color:var(--ink-soft)}
.moves b{font-family:var(--display); font-weight:400; font-size:1.6rem; color:var(--gold); font-variant-numeric:tabular-nums}

.relics{display:flex; gap:6px; flex-wrap:wrap; min-height:26px; align-items:center}
.relics .empty{font-size:.72rem; color:var(--ink-soft); font-weight:700}
.relic{display:flex; align-items:center; gap:5px; border:1.5px solid var(--line); background:var(--panel); border-radius:999px; padding:2px 9px 2px 2px; font-size:.7rem; font-weight:800; cursor:pointer}
.relic .seal{width:20px; height:20px; font-size:.8rem; border-radius:50%}

.board-wrap{position:relative; padding:9px; border-radius:22px; background:linear-gradient(170deg,#6a1f25,#3e1218); box-shadow:inset 0 0 0 2px var(--gold-dk), 0 0 0 1px #000, 0 16px 30px rgba(0,0,0,.45)}
.board-wrap.aim{box-shadow:inset 0 0 0 2px var(--gold), 0 0 0 3px rgba(240,184,74,.5), 0 16px 30px rgba(0,0,0,.45)}
#board{display:block; width:100%; aspect-ratio:1; max-width:100%; touch-action:none; border-radius:14px; background:#1c1723; cursor:pointer}

.tray{display:flex; flex-direction:column; gap:10px}
.tools{display:grid; grid-template-columns:repeat(3,1fr) 1.45fr; gap:6px}
.tool{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 4px 6px; background:var(--panel); border:1.5px solid var(--line); border-radius:14px; font-size:.7rem; font-weight:800; cursor:pointer}
.tool .seal{width:28px; height:28px; font-size:1.05rem}
.tool .count{position:absolute; top:-7px; right:-5px; min-width:20px; height:20px; padding:0 4px; border-radius:999px; background:var(--gold); color:#2a1a08; border:2px solid var(--bg); display:grid; place-items:center; font-size:.68rem; font-variant-numeric:tabular-nums}
.tool.active{border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,184,74,.25)}
.tool:disabled{opacity:.4; cursor:not-allowed}
.palm{position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; border:1.5px solid var(--line); border-radius:14px; background:var(--panel); cursor:pointer; padding:6px}
.palm .pf{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(180deg,rgba(240,184,74,.35),rgba(240,184,74,.15)); transition:width .3s}
.palm b,.palm small{position:relative}
.palm b{font-family:var(--display); font-weight:400; font-size:1.02rem}
.palm small{font-size:.66rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink-soft)}
.palm:disabled{cursor:not-allowed}
.palm.ready{background:var(--red); border-color:#ff7a6a; box-shadow:0 0 16px rgba(232,70,60,.5); animation:wiggle 1.2s ease-in-out infinite}
.palm.ready small{color:#ffe0d8}
.palm.ready .pf{display:none}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-3deg)}86%{transform:rotate(3deg)}94%{transform:rotate(-1deg)}}
.log{margin:0; text-align:center; font-weight:700; min-height:2.7em; font-size:.84rem; line-height:1.4; text-wrap:balance}
.card.passive{cursor:default; padding-block:6px}
.modal .cicon{flex:none; width:40px; height:40px; border-radius:0; background:none}
.legend{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.legend li{display:flex; flex-direction:column; align-items:center; gap:1px; font-size:.63rem; text-align:center; line-height:1.25; color:var(--ink-soft); font-weight:700}
.legend canvas{width:34px; height:34px}
.legend b{font-family:var(--display); font-weight:400; font-size:.82rem; color:var(--ink)}
.tips{margin:0; font-size:.7rem; color:var(--ink-soft); text-align:center; line-height:1.55}
.tips b{color:var(--ink)}

.seal{flex:none; display:inline-grid; place-items:center; width:38px; height:38px; border-radius:7px; background:var(--red); color:#fff3e6; font-family:var(--brush); font-size:1.4rem; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.seal.gold{background:var(--gold); color:#2a1a08}
.seal.jade{background:#2fa57c}
.seal.ink{background:#463b53}
.seal.violet{background:#6d4fc4}

.float{position:absolute; z-index:3; font-family:var(--display); font-size:1.2rem; pointer-events:none; white-space:nowrap;
  text-shadow:0 0 3px #000,0 0 6px #000; animation:floatUp 1.1s ease-out forwards}
.float.dmg{color:#ff7468} .float.shield{color:#7fe3b5} .float.heal{color:#ffb0c4} .float.calm{color:#c9a8ff} .float.guard{color:#d8cfe6} .float.coin{color:var(--gold)} .float.big{font-size:1.35rem; color:var(--gold)}
@keyframes floatUp{0%{opacity:0; transform:translate(-50%,10px) scale(.6)} 15%{opacity:1; transform:translate(-50%,0) scale(1.15)} 100%{opacity:0; transform:translate(-50%,-42px) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lunge{animation:lunge .4s ease-in-out}
@keyframes lunge{40%{transform:translateX(-18px) scale(1.08)}}
.hop{animation:hop .4s ease-out}
@keyframes hop{40%{transform:translate(10px,-10px)}}

.overlay{position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:var(--scrim);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal{background:linear-gradient(180deg,#2a2335,#1d1826); border-radius:22px; border:1.5px solid var(--gold-dk); padding:18px 18px 20px; max-width:390px; width:100%; max-height:100%; overflow:auto;
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; box-shadow:0 0 40px rgba(255,140,60,.15), 0 20px 50px rgba(0,0,0,.6); animation:popIn .3s cubic-bezier(.3,1.5,.6,1)}
@keyframes popIn{from{transform:scale(.8); opacity:0}}
.modal canvas{width:96px; height:96px; border-radius:50%; background:radial-gradient(circle, rgba(255,160,80,.25), transparent 68%)}
.kicker{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:800}
.modal h2{font-family:var(--display); font-weight:400; font-size:1.7rem; color:var(--ink); margin:0; text-wrap:balance; line-height:1.15}
.modal p{margin:0; line-height:1.55; font-size:.9rem; color:#ddd2e4; max-width:34em}
.modal p.story{font-size:.93rem; text-align:left}
.cards{display:flex; flex-direction:column; gap:8px; width:100%}
.card{display:flex; align-items:center; gap:10px; text-align:left; background:var(--panel); border:1.5px solid var(--line); border-radius:14px; padding:9px 11px; cursor:pointer}
.card:hover:not(:disabled){border-color:var(--gold)}
.card:disabled{opacity:.4; cursor:not-allowed}
.c-body{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1}
.c-title{font-family:var(--display); font-size:1.08rem}
.c-desc{font-size:.78rem; color:var(--ink-soft); line-height:1.35; font-weight:700}
.c-tag{display:flex; align-items:center; gap:4px; font-weight:800; font-size:.85rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.m-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.btn{font-family:var(--display); font-size:1.1rem; border:none; border-radius:14px; padding:10px 22px; background:var(--red); color:#fff3e6; box-shadow:0 4px 0 var(--red-dk); cursor:pointer}
.btn.quiet{background:var(--panel2); color:var(--ink); box-shadow:0 4px 0 #15111b}
@media (prefers-reduced-motion: reduce){
  .intent.soon,.palm.ready,.shake,.lunge,.hop,.modal,.lamp.now{animation:none}
  .float{animation-duration:1.4s}
}

/* Standalone / iPhone additions */
@media (max-width: 430px){
  .brand-en{display:none}
  h1{font-size:1.7rem}
  .app{gap:8px}
  .arena{padding:8px 8px 10px}
  .side canvas{width:52px; height:52px}
  .side{gap:3px}
  .lamp{aspect-ratio:1/1; font-size:.75rem}
  .path{gap:4px}
  .road{gap:4px}
  .act{font-size:.66rem}
  .act b{font-size:.85rem}
  .ihint{font-size:.6rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .chips{min-height:20px}
  .board-wrap{padding:6px; border-radius:18px}
  .top{margin-bottom:-2px}
  .name{font-size:.92rem}
  .relics .empty{display:none}
  .relics{min-height:0}
  .log{min-height:2.4em; font-size:.8rem}
  .tool{padding:5px 4px 4px}
  .tool .seal{width:24px; height:24px; font-size:.9rem}
}

:root{padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
body{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><h1>守灯人</h1><span class="brand-en">The Lantern Keeper</span></div>
    <div class="top-right">
      <span class="purse" title="Coins"><i class="coin"></i><span id="coins">8</span></span>
      <button class="icon-btn" id="help" aria-label="How to play">?</button>
      <button class="icon-btn" id="mute" aria-pressed="false" aria-label="Sound">♪</button>
    </div>
  </header>

  <div class="road">
    <div class="act"><b id="actName">Act I · 鬼市 Ghost Market</b><span id="dread">Dread 0</span></div>
    <nav class="path" id="path" aria-label="Twelve lanterns to dawn"></nav>
  </div>

  <section class="arena" aria-label="Battle">
    <div class="side" id="pCard">
      <canvas id="pCan" width="200" height="200" aria-hidden="true"></canvas>
      <div class="name">Bao 宝宝 <small id="pLv">Level 1</small></div>
      <div class="bar"><div class="fill" id="pFill"></div><span id="pTxt">50 / 50</span></div>
      <div class="xp" title="Experience"><i id="pXp"></i></div>
      <div class="chips"><span class="chip shield off" id="pShield">Shield 0</span></div>
    </div>
    <div class="vs">对</div>
    <div class="side enemy" id="eCard">
      <canvas id="eCan" width="200" height="200" aria-hidden="true"></canvas>
      <div class="name" id="eName">Egui 饿鬼 <small>hungry ghost</small></div>
      <div class="bar"><div class="fill" id="eFill"></div><span id="eTxt">46 / 46</span></div>
      <div class="chips">
        <span class="intent" id="intent" data-kind="feast"><span id="iLabel">Feast 3×6</span><span class="iturns" id="iTurns" title="Turns until it acts">3</span></span>
        <span class="chip guard" id="eGuard" hidden>Guard 0</span>
      </div>
      <div class="brk" id="iBrk" hidden><i id="iBrkFill"></i></div>
      <div class="ihint" id="iHint">Clear or exorcise the marked tiles</div>
    </div>
    <div class="side" id="gCard" hidden>
      <div class="goal-title" id="gTitle">Yin Frost <small>Break all the frost</small></div>
      <div class="goals" id="goals"></div>
      <div class="moves">Moves <b id="gMoves">18</b></div>
    </div>
  </section>

  <div class="relics" id="relics"></div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="board" aria-label="Match-3 board. Drag a tile onto a neighbor, or tap two neighbors, to swap them."></canvas>
  </div>

  <section class="tray">
    <div class="tools">
      <button class="tool" id="tHammer"><span class="seal ink">锤</span>Hammer<b class="count" id="nHammer">1</b></button>
      <button class="tool" id="tSwap"><span class="seal jade">换</span>Free swap<b class="count" id="nSwap">1</b></button>
      <button class="tool" id="tLantern"><span class="seal gold">灯</span>Lantern<b class="count" id="nLantern">1</b></button>
      <button class="palm" id="palm" disabled><span class="pf" id="palmFill"></span><b>Kung Fu Palm</b><small id="palmTxt">0 / 12 chi</small></button>
    </div>
    <p class="log" id="log">The Ghost Gate is open.</p>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <canvas id="mCan" width="200" height="200" aria-hidden="true"></canvas>
    <span class="kicker" id="mKicker" hidden></span>
    <h2 id="mTitle">The Lantern Keeper</h2>
    <p id="mText"></p>

/* ================= state ================= */

const pctx = $('pCan').getContext('2d'), ectx = $('eCan').getContext('2d'), mctx = $('mCan').getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function newPiece(kind, t, c, r) { return { id: uid++, kind, t, sp: null, lock: 0, hp: 1, mark: null, c, r, x: c, y: r, v: 0, pulse: 0, squish: 0, phase: Math.random() * 10 }; }
function neighbors(k) {
  const c = kc(k), r = kr(k), out = [];
  if (c > 0) out.push(k - 1); if (c < COLS - 1) out.push(k + 1);
  if (r > 0) out.push(k - COLS); if (r < ROWS - 1) out.push(k + COLS);
  return out;
}

const swappable = p => p && p.kind !== 'stone' && !p.lock;
const isPlainGem = p => matchable(p) && !p.sp && !p.lock;

/* ================= persistence (per-viewer convenience) ================= */

/* ================= sound ================= */
let actx = null, muted = false;
function sfx(f = 520, d = 0.09, type = 'sine', vol = 0.07) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now); o.frequency.exponentialRampToValueAtTime(f * 1.6, now + d);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + d);
    o.connect(g).connect(actx.destination); o.start(now); o.stop(now + d + 0.02);
  } catch (e) {}
}

/* ================= board: build ================= */
function fillBoard() {
  grid = []; ice = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]); ice.push(new Array(COLS).fill(0));
    for (let c = 0; c < COLS; c++) {
      let t, tries = 0;
      do { t = rnd(5); } while (tries++ < 40 && makesMatch(c, r, t));
      const p = newPiece('gem', t, c, r); p.y = r - ROWS - 1 - c * 0.12;
      grid[r].push(p);
    }
  }
  if (!findMove()) fillBoard();
}
function makesMatch(c, r, t) {
  const T_ = (cc, rr) => grid[rr] && grid[rr][cc] ? grid[rr][cc].t : -9;
  return (c >= 2 && T_(c-1, r) === t && T_(c-2, r) === t) ||
         (r >= 2 && T_(c, r-1) === t && T_(c, r-2) === t) ||
         (c >= 1 && r >= 1 && T_(c-1, r) === t && T_(c, r-1) === t && T_(c-1, r-1) === t);
}
function replacePiece(k, np) { const old = at(k); np.x = old ? old.x : kc(k); np.y = old ? old.y : kr(k); grid[kr(k)][kc(k)] = np; return np; }
function applySetup(s) {
  const all = shuffleArr([...Array(COLS * ROWS).keys()]);
  if (s.ice) all.filter(k => kr(k) >= 1).slice(0, s.ice).forEach((k, i) => ice[kr(k)][kc(k)] = i < (s.ice2 || 0) ? 2 : 1);
  if (s.stones) shuffleArr(all.filter(k => kr(k) >= 2 && isPlainGem(at(k)))).slice(0, s.stones).forEach(k => replacePiece(k, newPiece('stone', STONE, kc(k), kr(k))));
  if (s.locks) shuffleArr(all.filter(k => isPlainGem(at(k)))).slice(0, s.locks).forEach(k => at(k).lock = 1);
  if (s.env) shuffleArr([...Array(COLS).keys()]).slice(0, s.env).forEach(c => replacePiece(keyOf(c, rnd(2)), newPiece('env', 0, c, 0)));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const p = grid[r][c]; if (p) { p.c = c; p.r = r; } }

      if (g.kind === 'ice') g.need = ice.flat().reduce((a, b) => a + b, 0);
      if (g.kind === 'stone') g.need = allPieces().filter(p => p.kind === 'stone').length;
      if (g.kind === 'lock') g.need = allPieces().filter(p => p.lock).length;
    }
  }
}

/* ================= board: matching ================= */
function findGroups() {
  const runs = [], squares = [];
  const same = (a, b) => matchable(a) && matchable(b) && a.t === b.t;
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      let e = c + 1;
      if (matchable(grid[r][c])) while (e < COLS && same(grid[r][c], grid[r][e])) e++;
      if (e - c >= 3) { const keys = []; for (let i = c; i < e; i++) keys.push(keyOf(i, r)); runs.push({ dir: 'h', keys }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      let e = r + 1;
      if (matchable(grid[r][c])) while (e < ROWS && same(grid[r][c], grid[e][c])) e++;
      if (e - r >= 3) { const keys = []; for (let i = r; i < e; i++) keys.push(keyOf(c, i)); runs.push({ dir: 'v', keys }); }
      r = e;
    }
  }
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) {
    const a = grid[r][c];
    if (matchable(a) && same(a, grid[r][c+1]) && same(a, grid[r+1][c]) && same(a, grid[r+1][c+1]))
      squares.push([keyOf(c, r), keyOf(c+1, r), keyOf(c, r+1), keyOf(c+1, r+1)]);
  }
  if (!runs.length && !squares.length) return [];
  const parent = new Map();
  const find = k => { while (parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };
  for (const set of [...runs.map(r => r.keys), ...squares]) {
    for (const k of set) if (!parent.has(k)) parent.set(k, k);
    for (let i = 1; i < set.length; i++) union(set[0], set[i]);
  }
  const groups = new Map();
  const get = k => { const root = find(k); if (!groups.has(root)) groups.set(root, { cells: new Set(), runs: [], squares: [], t: at(k).t, hk: new Set(), vk: new Set() }); return groups.get(root); };
  for (const run_ of runs) { const g = get(run_.keys[0]); g.runs.push(run_); run_.keys.forEach(k => { g.cells.add(k); (run_.dir === 'h' ? g.hk : g.vk).add(k); }); }
  for (const sq of squares) { const g = get(sq[0]); g.squares.push(sq); sq.forEach(k => g.cells.add(k)); }
  const out = [...groups.values()];
  for (const g of out) g.inter = [...g.hk].find(k => g.vk.has(k));
  return out;
}
function groupSpecial(g) {
  let maxH = 0, maxV = 0, longest = null;
  for (const r of g.runs) {
    if (r.dir === 'h') maxH = Math.max(maxH, r.keys.length); else maxV = Math.max(maxV, r.keys.length);
    if (!longest || r.keys.length > longest.keys.length) longest = r;
  }
  g.longest = longest;
  if (maxH >= 5 || maxV >= 5) return 'rainbow';
  if (maxH >= 3 && maxV >= 3) return 'bomb';
  if (maxH === 4) return 'h';
  if (maxV === 4) return 'v';
  if (g.squares.length) return 'rocket';
  return null;
}
function findMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const a = grid[r][c];
    if (a && a.kind === 'gem' && a.sp && !a.lock) return [{ c, r }];
    for (const [dc, dr] of [[1, 0], [0, 1]]) {
      const c2 = c + dc, r2 = r + dr;
      if (c2 >= COLS || r2 >= ROWS) continue;
      const b = grid[r2][c2];
      if (!swappable(a) || !swappable(b)) continue;
      grid[r][c] = b; grid[r2][c2] = a;
      const found = findGroups().length > 0;
      grid[r][c] = a; grid[r2][c2] = b;
      if (found) return [{ c, r }, { c: c2, r: r2 }];
    }
  }
  return null;
}
function isSettled() {
  if (dying.length) return false;
  for (const row of grid) for (const p of row) if (p && (p.x !== p.c || p.y !== p.r)) return false;
  return true;
}
const settled = () => new Promise(res => { const chk = () => isSettled() ? res() : requestAnimationFrame(chk); chk(); });
function swapCells(a, b) {
  const pa = grid[a.r][a.c], pb = grid[b.r][b.c];
  grid[a.r][a.c] = pb; grid[b.r][b.c] = pa;
  if (pb) { pb.c = a.c; pb.r = a.r; }
  if (pa) { pa.c = b.c; pa.r = b.r; }
}
function spawnPiece(c, r) {
  if (goalActive('env')) {
    const g = stage.goals.find(g => g.kind === 'env');
    const onBoard = allPieces().filter(p => p.kind === 'env').length;
    if (g.got + onBoard < g.need && onBoard < 2 && Math.random() < 0.2) return newPiece('env', 0, c, r);
  }
  return newPiece('gem', rnd(5), c, r);
}
function gravity() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const p = grid[r][c];
      if (p) { if (r !== write) { grid[write][c] = p; grid[r][c] = null; p.r = write; } write--; }
    }
    const n = write + 1;
    for (let r = write; r >= 0; r--) { const p = spawnPiece(c, r); p.y = r - n - 0.3; grid[r][c] = p; }
  }
}
function mostCommonColor() {
  const cnt = [0, 0, 0, 0, 0];
  for (const p of allPieces()) if (matchable(p)) cnt[p.t]++;
  return cnt.indexOf(Math.max(...cnt));
}

/* ================= goals & targets ================= */
function goalActive(kind) { return stage && stage.type === 'challenge' && stage.goals.some(g => g.kind === kind && g.got < g.need); }
function goalProgress(kind) {
  if (!stage || stage.type !== 'challenge') return;
  const g = stage.goals.find(g => g.kind === kind && g.got < g.need);
  if (g) g.got++;
}
const goalsDone = () => stage.goals.every(g => g.got >= g.need);
function targetCandidates() {
  const out = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = grid[r][c], k = keyOf(c, r);
    if (p && p.mark) { out.push(k); continue; }
    if (ice[r][c] > 0 && goalActive('ice') && p && p.kind !== 'env') { out.push(k); continue; }
    if (p && p.kind === 'stone') { out.push(k); continue; }
    if (p && p.lock) { out.push(k); continue; }
    if (p && matchable(p) && goalActive('gem' + p.t)) { out.push(k); continue; }
    if (goalActive('env') && p && p.kind !== 'env' && r > 0) { const up = grid[r-1][c]; if (up && up.kind === 'env') out.push(k); }
  }
  return out;
}

/* ================= resolving ================= */
function lineArea(dir, c, r, out) {
  if (dir === 'h') { for (let i = 0; i < COLS; i++) out.push(keyOf(i, r)); fx.push({ kind: 'row', i: r, life: 1 }); }
  else { for (let i = 0; i < ROWS; i++) out.push(keyOf(c, i)); fx.push({ kind: 'col', i: c, life: 1 }); }
}
function squareArea(c, r, rad, out) {
  for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
    const cc = c + dc, rr = r + dr;
    if (cc >= 0 && rr >= 0 && cc < COLS && rr < ROWS) out.push(keyOf(cc, rr));
  }
  fx.push({ kind: 'ring', c, r, rad, life: 1 });
}
function areaOf(sp, k, out) {
  const c = kc(k), r = kr(k);
  if (sp === 'h' || sp === 'v') lineArea(sp, c, r, out);
  else if (sp === 'bomb') squareArea(c, r, hasRelic('lantern') ? 2 : 1, out);
}
function fireSpecial(p, k, hits, state) {
  const c = kc(k), r = kr(k), out = [];
  if (p.sp === 'h' || p.sp === 'v') { lineArea(p.sp, c, r, out); sfx(320, 0.16, 'triangle', 0.07); }
  else if (p.sp === 'bomb') { squareArea(c, r, hasRelic('lantern') ? 2 : 1, out); sfx(150, 0.22, 'triangle', 0.09); }
  else if (p.sp === 'rainbow') {
    const col = mostCommonColor();

async function resolveHits(hits, level, creates = [], matched = false) {
  const createKeys = new Set(creates.map(o => keyOf(o.c, o.r)));
  const base = matched ? new Set(hits) : new Set();
  const queue = [...hits], fired = new Set(), state = { flew: false };
  while (queue.length) {
    const k = queue.pop(), p = at(k);
    if (!p || p.kind !== 'gem' || !p.sp || fired.has(p.id) || createKeys.has(k)) continue;
    fired.add(p.id);
    for (const k2 of fireSpecial(p, k, hits, state)) if (!hits.has(k2)) { hits.add(k2); queue.push(k2); }
  }
  if (state.flew) await sleep(320);
  for (const k of [...hits]) {
    const p = at(k);
    if (!p || p.kind !== 'gem' || p.lock) continue;
    for (const n of neighbors(k)) { const q = at(n); if (q && q.kind === 'stone') hits.add(n); }
  }
  const tally = [0, 0, 0, 0, 0];
  for (const k of hits) {
    const c = kc(k), r = kr(k), p = grid[r][c];
    if (ice[r][c] > 0 && (!p || p.kind !== 'env')) { ice[r][c]--; goalProgress('ice'); iceBurst(c, r); }
    if (!p || p.kind === 'env') continue;
    if (createKeys.has(k)) { douse(p); continue; }
    if (p.kind === 'stone') { p.hp--; p.pulse = 1; if (p.hp <= 0) { kill(p); goalProgress('stone'); } continue; }
    if (p.lock) { p.lock = 0; p.pulse = 1; burst(p, '#ffe27a'); goalProgress('lock'); continue; }
    if (p.t >= 0) { tally[p.t] += base.has(k) ? 1 : 0.5; goalProgress('gem' + p.t); }
    kill(p);
  }
  for (const o of creates) {
    const p = grid[o.r][o.c];
    if (p) { p.t = o.t; p.sp = o.sp; p.lock = 0; p.pulse = 1; }
    if (hasRelic('drum') && stage.type === 'battle') turn.pendingDmg += 4;
  }
  sfx(380 + level * 70, 0.1, 'sine', 0.07);
  applyTally(tally, level);
  await sleep(170);
  gravity();
  await settled();
  await collectSouls();
}

async function cascade(focus, level = 0) {

async function comboSwap(pa, pb, b) {

function exorcise(points) {
  let left = points;
  if (stage.type === 'battle') {
    const marked = shuffleArr(allPieces().filter(p => p.mark));
    while (left > 0 && marked.length) { const p = marked.pop(); douse(p); p.pulse = 1; turn.exo++; left--; }
  }
  const sealed = shuffleArr(allPieces().filter(p => p.lock));
  while (left > 0 && sealed.length) { const p = sealed.pop(); p.lock = 0; p.pulse = 1; burst(p, '#ffe27a'); goalProgress('lock'); turn.exo++; left--; }
  if (left > 0 && stage.type === 'battle' && (enemy.intent.k === 'atk' || enemy.intent.k === 'charge') && enemy.intent.val > 0) {
    const before = enemy.intent.val; enemy.intent.val = Math.max(0, before - left);
    turn.exo += before - enemy.intent.val;
    floatText($('eCard'), `−${before - enemy.intent.val}`, 'calm');
  }
  if (points) sfx(1320, 0.18, 'sine', 0.04);
}
function applyTally(tally, level) {
  const m = 1 + comboStep() * (level - 1), lv = hero.lv;
  turn.maxLevel = Math.max(turn.maxLevel, level);
  if (tally[3]) {
    const c = Math.round(tally[3] * coinMul()); run.coins += c; turn.coins += c;
    const chi = Math.round(tally[3] * lv[3] * m); hero.chi = Math.min(hero.chiMax, hero.chi + chi); turn.chi += chi;
  }
  if (tally[2]) { const h = healHero(Math.floor(tally[2] * lv[2] * m / 2)); turn.heal += h; if (h) floatText($('pCard'), `+${h}`, 'heal'); }
  if (tally[4]) exorcise(Math.floor(tally[4] * lv[4] * m / 2));
  if (stage.type === 'battle') {
    const dmg = Math.round(tally[0] * (2 + lv[0]) * m) + turn.pendingDmg;
    turn.pendingDmg = 0;
    const sh = Math.round(tally[1] * (1 + lv[1]) * m);
    if (sh) { const add = Math.max(0, Math.min(sh, 25 - hero.shield)); hero.shield += add; turn.shield += add; floatText($('pCard'), `+${sh}`, 'shield'); }
    if (dmg) hitEnemy(dmg);
  }

}
function healHero(n) { const add = Math.max(0, Math.min(n, hero.max - hero.hp)); hero.hp += add; return add; }
function hitEnemy(d) {
  if (!enemy || enemy.hp <= 0) return;
  const blocked = Math.min(enemy.guard, d);
  enemy.guard -= blocked;
  const real = d - blocked;
  enemy.hp = Math.max(0, enemy.hp - real);
  turn.dmg += real;
  if (real) { enemy.hurt = 0.45; floatText($('eCard'), `−${real}`, 'dmg'); }
  if (blocked) floatText($('eCard'), `guard ${blocked}`, 'guard');
  const it = enemy.intent;
  if (it.k === 'charge' && !enemy.interrupted) {
    it.dealt += real;
    if (it.dealt >= it.brk) { enemy.interrupted = true; floatText($('eCard'), 'Interrupted!', 'big'); sfx(1046, 0.3, 'triangle', 0.08); }
  }
  if (enemy.phase2 && !enemy.inPhase2 && enemy.hp > 0 && enemy.hp <= enemy.max / 2) enemy.phaseNow = true;
  const pc = $('pCan'); pc.classList.remove('hop'); void pc.offsetWidth; pc.classList.add('hop');
}
function damagePlayer(v) {
  const absorbed = Math.min(hero.shield, v);

  const real = v - absorbed;
  hero.hp = Math.max(0, hero.hp - real);
  if (real) { hero.hurt = 0.5; floatText($('pCard'), `−${real}`, 'dmg'); shake($('pCard')); sfx(130, 0.22, 'square', 0.05); }
  if (absorbed) floatText($('pCard'), `blocked ${absorbed}`, 'shield');
  if (v > 0 && real === 0 && hasRelic('taiji')) { hitEnemy(8); floatText($('eCard'), 'Taiji!', 'guard'); }

async function enemyAct() {

      break;

      enemy.guard = it.val; floatText($('eCard'), `guard ${it.val}`, 'guard');
      msg = `${enemy.name} braces itself. The next ${it.val} damage is blocked.`;
      break;
    case 'heal': {
      const add = Math.min(it.val, enemy.max - enemy.hp); enemy.hp += add; floatText($('eCard'), `+${add}`, 'heal');

      msg = `${enemy.name} pinches ${took} coins from your purse.`; break;
    }
    case 'forget': {
      hero.shield = 0; hero.chi = 0;
      const add = Math.min(it.val, enemy.max - enemy.hp); enemy.hp += add;
      floatText($('pCard'), 'Forgotten…', 'calm');
      const { real } = damagePlayer(it.dmg || 0);
      msg = `The Soup of Forgetting splashes Bao for ${real}. Shield and chi are gone, and ${enemy.name} heals ${add}.`; break;
    }

  sfx(110, 0.25, 'sawtooth', 0.04);
  if (enemy.graveGuard) {

  allPieces().forEach(p => { if (p.mark && p.mark.iid === it.iid) p.mark = null; });
  nextIntent(true);
  return msg + ' Next: ' + intentLabel(enemy.intent) + '.';
}

function turnSummary() {
  const b = [];
  if (turn.dmg) b.push(`${turn.dmg} damage`);
  if (turn.shield) b.push(`+${turn.shield} shield`);
  if (turn.heal) b.push(`+${turn.heal} HP`);
  if (turn.doused) b.push(`${turn.doused} mark${turn.doused > 1 ? 's' : ''} cleared`);
  if (turn.exo && !turn.doused) b.push('exorcised');
  if (turn.coins) b.push(`+${turn.coins} coins`);
  let s = b.length ? b.join(', ') + '.' : 'Nothing much happens.';
  if (turn.maxLevel > 1) s = `${turn.maxLevel}-chain! ` + s;
  return s;
}

async function afterBoardChange(consume) {
  if (stage.over) return;
  renderHUD();
  if (stage.type === 'battle') {
    if (enemy.hp <= 0) { setLog(turnSummary() + ` ${enemy.name} fades away.`); return endStage('win'); }
    let msg = turnSummary();
    if (enemy.phaseNow) {
      enemy.phaseNow = false; enemy.inPhase2 = true; enemy.pattern = enemy.phase2; enemy.pi = -1;
      allPieces().forEach(p => p.mark = null);
      nextIntent(true);
      msg = enemy.phaseLine + ' ' + intentIntro(enemy.intent);

    } else if (enemy.interrupted) {

      msg += ` ${enemy.intent.name} is interrupted!`;
      nextIntent(true);
      if (reflect) { hitEnemy(reflect); msg += ` The Bagua Mirror reflects ${reflect}.`; }
      msg += ' ' + intentIntro(enemy.intent);
    } else if (consume) {
      enemy.intent.t--;

    setLog(msg); renderHUD();

    if (consume) stage.moves--;

    if (goalsDone()) { setLog('Every goal is done!'); return endStage('win'); }
    if (stage.moves <= 0) { setLog('Out of moves.'); return endStage('lose'); }

  }
  if (!findMove()) await shuffle();
}

const actOf = f => f >= 9 ? 3 : f >= 5 ? 2 : 1;

function weightedPick(pool, n) {
  const out = [], copy = pool.slice();
  while (out.length < n && copy.length) {
    const total = copy.reduce((s, o) => s + (o.w || 1), 0);
    let x = Math.random() * total, i = 0;
    while ((x -= (copy[i].w || 1)) > 0) i++;
    out.push(copy.splice(i, 1)[0]);
  }
  return out;
}
async function chooseNode() {

  let opts;
  if (f === 4 || f === 8) opts = ['elite'];
  else if (f === FLOORS) opts = ['boss'];
  else {
    opts = weightedPick([{ v:'battle', w:5 }, { v:'challenge', w:3 }, { v:'shop', w:2 }, { v:'event', w:2 }, { v:'rest', w:1 }], 3).map(o => o.v);
    if (f === FLOORS - 1 && !opts.includes('rest')) opts[2] = 'rest';

    text: opts.length > 1 ? 'Choose where to light the next lantern.' : NODES[opts[0]].desc,

function makeEnemy(key, scale) {

  return { ...d, key, hp: Math.round(d.hp * hs), max: Math.round(d.hp * hs), guard: 0, pi: -1, hurt: 0,
    pattern: scaleP(d.pattern), phase2: d.phase2 ? scaleP(d.phase2) : null, intent: { k: 'atk', val: 0, t: 1 } };
}

  }
  for (const p of dying) p.dying -= dt * 5;
  dying = dying.filter(p => p.dying > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 7 * dt; p.life -= dt * 1.7; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.life -= dt * 0.9; p.y -= dt * 0.5; }
  pops = pops.filter(p => p.life > 0);
  for (const f of fx) f.life -= dt * (f.kind === 'fly' ? 3.2 : 2.6);
  fx = fx.filter(f => f.life > 0);
  if (hero) {
    hero.hurt = Math.max(0, hero.hurt - dt); hero.punch = Math.max(0, hero.punch - dt);
    if (enemy) enemy.hurt = Math.max(0, enemy.hurt - dt);
    if (canPlay() && !mode) { idle += dt; if (idle > 7 && !hint) hint = findMove(); }
    if (board.width && grid.length) drawBoard();
    drawPanda(pctx, T, hero.hurt, hero.punch, 'happy');
    if (enemy && !$('eCard').hidden) drawEnemy(ectx, enemy, T);
    if (!$('overlay').hidden && modalPortrait) {
      if (modalPortrait.who === 'enemy' && enemy) drawEnemy(mctx, enemy, T, modalPortrait.hurt);
      else drawPanda(mctx, T, 0, 0, modalPortrait.mood || 'happy');
    }
  }
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
mainMenu();
})();
</script>
